<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a56db"/>
      <stop offset="50%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:rgba(96,165,250,0.3)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  
  <!-- Pattern dots -->
  <g opacity="0.06" fill="white">
    <circle cx="100" cy="100" r="2"/>
    <circle cx="200" cy="100" r="2"/>
    <circle cx="300" cy="100" r="2"/>
    <circle cx="400" cy="100" r="2"/>
    <circle cx="500" cy="100" r="2"/>
    <circle cx="600" cy="100" r="2"/>
    <circle cx="700" cy="100" r="2"/>
    <circle cx="800" cy="100" r="2"/>
    <circle cx="900" cy="100" r="2"/>
    <circle cx="1000" cy="100" r="2"/>
    <circle cx="1100" cy="100" r="2"/>
    <circle cx="150" cy="200" r="2"/>
    <circle cx="250" cy="200" r="2"/>
    <circle cx="350" cy="200" r="2"/>
    <circle cx="450" cy="200" r="2"/>
    <circle cx="550" cy="200" r="2"/>
    <circle cx="650" cy="200" r="2"/>
    <circle cx="750" cy="200" r="2"/>
    <circle cx="850" cy="200" r="2"/>
    <circle cx="950" cy="200" r="2"/>
    <circle cx="1050" cy="200" r="2"/>
  </g>
  
  <!-- Logo box -->
  <rect x="555" y="120" width="90" height="90" rx="20" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
  <text x="600" y="178" font-family="system-ui, sans-serif" font-size="48" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-2">CC</text>
  
  <!-- Title -->
  <text x="600" y="280" font-family="system-ui, sans-serif" font-size="56" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-1.5">Campus Cab</text>
  
  <!-- Subtitle -->
  <text x="600" y="320" font-family="system-ui, sans-serif" font-size="24" font-weight="500" fill="#93c5fd" text-anchor="middle">University Ride-Hailing Platform</text>
  
  <!-- Feature pills -->
  <g font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="rgba(255,255,255,0.9)">
    <rect x="240" y="360" width="160" height="40" rx="20" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="320" y="386" text-anchor="middle">🚕 Solo Cab</text>
    
    <rect x="420" y="360" width="180" height="40" rx="20" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="510" y="386" text-anchor="middle">🚐 Shared Shuttle</text>
    
    <rect x="620" y="360" width="170" height="40" rx="20" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="705" y="386" text-anchor="middle">🛡️ SOS Safety</text>
    
    <rect x="810" y="360" width="180" height="40" rx="20" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="900" y="386" text-anchor="middle">📍 Live Tracking</text>
  </g>
  
  <!-- Bottom bar -->
  <circle cx="570" cy="590" r="4" fill="#4ade80"/>
  <text x="585" y="595" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Book rides across campus — free for students</text>
</svg>
